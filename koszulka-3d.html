<h1>Etui w kształcie koszulki na butelkę 50 ml – koncept 3D</h1>
<p class="lead">Wstępna wizualizacja konstrukcji pod druk SLA. Szkic – fałdy i kształt koszulki zostaną dopracowane w finalnym modelu.</p>
<figure><img src="koszulka-3d/przod.png" alt="Etui-koszulka z butelką, widok z przodu" width="1200" height="900"><figcaption>Przód – krótkie rękawy, dekolt V, szwy i fałdy, atomizer nad dekoltem.</figcaption></figure>
<figure><img src="koszulka-3d/tyl.png" alt="Etui-koszulka, widok z tyłu z przykładowym nadrukiem" width="1200" height="900"><figcaption>Tył – płaskie pole pod nadruk imienia i numeru (przykład).</figcaption></figure>
<figure><img src="koszulka-3d/przekroj.png" alt="Przekrój etui z butelką w środku i zaślepką" width="1200" height="900"><figcaption>Przekrój – otwór Ø38,45 mm, kołnierz pod ramiona R 8,5 / R 3, ścianki min. 3 mm, dolna zaślepka dociskająca dno.</figcaption></figure>
