<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Ilustracje line-art – próbki</title>
<style>
body{margin:0;font-family:"Segoe UI",system-ui,sans-serif;background:#f6f3ec;color:#1d1d1b;line-height:1.5}
main{max-width:760px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:clamp(22px,4vw,30px);font-weight:600;margin:0 0 6px}
p.lead{color:#555;margin:0 0 24px}
figure{margin:0 0 28px;background:#fff;border:1px solid #e2ddd2}
figure img{display:block;width:100%;height:auto}
figcaption{padding:10px 14px;font-size:15px;color:#333}
</style>
</head>
<body>
<main>
<h1>Ilustracje line-art z akcentem koloru – próbki</h1>
<p class="lead">Trzy przykłady w stylu książki: cienki kontur, jasne tło i 1–2 akcenty kolorystyczne.</p>
<figure><img src="ilustracje-ksiazka/1-fotel.png" alt="Puchowy fotel w kolorze bladego różu ze złotym kluczem, line-art na kremowym tle" width="1024" height="1024"><figcaption>Fotel w kolorze bladego różu ze złotym kluczem – tło kremowe.</figcaption></figure>
<figure><img src="ilustracje-ksiazka/2-lawka.png" alt="Rodzic i dziecko na ławce widziani od tyłu, mała złota latarenka, tło jasnozielone" width="1024" height="1024"><figcaption>Rodzic z dzieckiem na ławce, akcent: ciepła latarenka – tło jasnozielone.</figcaption></figure>
<figure><img src="ilustracje-ksiazka/3-domek.png" alt="Drewniany domek na wzgórzu z różowym oknem i złotą smugą dymu" width="1024" height="1024"><figcaption>Domek na wzgórzu, akcenty: różowe okno i złota smuga dymu.</figcaption></figure>
<h2 style="font-size:20px;font-weight:600;margin:36px 0 6px">Sceny z książki – próba</h2>
<p class="lead">Strażnik w kształcie migdała i uproszczone elementy mózgu według opisu.</p>
<figure><img src="ilustracje-ksiazka/4-straznik-fotel.png" alt="Strażnik w kształcie migdała śpiący na puchatym pastelowo-różowym fotelu, obok złoty klucz" width="1024" height="1024"><figcaption>Strażnik – postać w kształcie migdała – śpi na puchatym fotelu, pośrodku złoty klucz.</figcaption></figure>
<figure><img src="ilustracje-ksiazka/5-mozg.png" alt="Uproszczony mózg: pień mózgu na zielono, układ limbiczny na różowo z migdałem, kora na lawendowo" width="1024" height="1024"><figcaption>Uproszczony mózg: pień mózgu, układ limbiczny z ciałem migdałowatym i kora mózgowa.</figcaption></figure>
</main>
</body>
</html>
