<h1>Ilustracje do książki – etap 1</h1>
<p class="lead">Pierwsze ilustracje do akceptacji. Kliknij obrazek, aby otworzyć go w pełnym rozmiarze.</p>
<figure><a href="ilustracje-147820/1-wzor-straznika.jpg"><img src="ilustracje-147820/1-wzor-straznika.jpg" alt="Strażnik w kształcie migdała w czterech pozach" width="1536" height="864"></a><figcaption><b>Wzór strażnika</b> – postać w kształcie migdała w kilku pozach. Według tego wzoru rysuję go we wszystkich scenach.</figcaption></figure>
<figure><a href="ilustracje-147820/2-fotel.jpg"><img src="ilustracje-147820/2-fotel.jpg" alt="Puchowy różowy fotel, w rogu śpi strażnik, w drugim rogu otwarta kłódka, pomiędzy złoty klucz" width="1280" height="960" loading="lazy"></a><figcaption><b>Puchowy fotel</b> – w rogu śpiący strażnik bez kłódki, kłódka otwarta w drugim rogu, pomiędzy klucz.</figcaption></figure>
<figure><a href="ilustracje-147820/3-straznik-z-klodka.jpg"><img src="ilustracje-147820/3-straznik-z-klodka.jpg" alt="Strażnik w kształcie migdała trzyma złotą kłódkę" width="1280" height="960" loading="lazy"></a><figcaption><b>Strażnik z kłódką w ręku.</b></figcaption></figure>
<figure><a href="ilustracje-147820/4-poddasze-z-klodka.jpg"><img src="ilustracje-147820/4-poddasze-z-klodka.jpg" alt="Przekrój domku: na piętrze emocji ogień, strażnik zamyka na kłódkę drzwi do pokoju myślenia na poddaszu" width="960" height="1280" loading="lazy"></a><figcaption><b>Poddasze domku z wielką kłódką</b> – ogień na piętrze emocji, strażnik zamyka drzwi do pokoju myślenia.</figcaption></figure>
<figure><a href="ilustracje-147820/5-parter-propozycja.jpg"><img src="ilustracje-147820/5-parter-propozycja.jpg" alt="Przekrój domku z zarysem mózgu, na parterze wyróżniony pień mózgu" width="960" height="1280" loading="lazy"></a><figcaption><b>Propozycja: parter domku – obraz anatomiczny.</b> Pień mózgu (mózg gadzi) na parterze domku, nad nim blady zarys całego mózgu.</figcaption></figure>
