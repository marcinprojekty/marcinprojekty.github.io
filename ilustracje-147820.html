<h1>Ilustracje do książki – etap 1</h1>
<p class="lead">Pierwsze ilustracje do akceptacji. Kliknij obrazek, aby otworzyć go w pełnym rozmiarze.</p>
<h2>Poprawki – przed i po</h2>

<div class="pair">
<figure><a href="ilustracje-147820/1-wzor-straznika.jpg"><img src="ilustracje-147820/1-wzor-straznika.jpg" alt="Poprzedni wzór: strażnik w kształcie migdała z rumieńcami, w czterech pozach" width="1536" height="864"></a><figcaption>Przed</figcaption></figure>
<figure><a href="ilustracje-147820/1-wzor-straznika-po2.jpg"><img src="ilustracje-147820/1-wzor-straznika-po2.jpg" alt="Nowy wzór: poważny strażnik w kształcie migdała z pasem, przy którym wiszą kłódka i klucze, w czterech pozach" width="1536" height="864"></a><figcaption>Po</figcaption></figure>
</div>
<h3>Puchowy fotel</h3>
<div class="pair">
<figure><a href="ilustracje-147820/2-fotel.jpg"><img src="ilustracje-147820/2-fotel.jpg" alt="Poprzednia wersja: różowy fotel, śpiący strażnik z rumieńcami, klucz i otwarta kłódka" width="1280" height="960" loading="lazy"></a><figcaption>Przed</figcaption></figure>

<figure><a href="ilustracje-147820/3-straznik-z-klodka-po2.jpg"><img src="ilustracje-147820/3-straznik-z-klodka-po2.jpg" alt="Nowa wersja: poważny strażnik z pasem i kluczami trzyma złotą kłódkę" width="1280" height="960" loading="lazy"></a><figcaption>Po</figcaption></figure>
