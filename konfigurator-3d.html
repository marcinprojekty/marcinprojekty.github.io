<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Konfigurator automatów 3D – demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  /* Koncepcja: narzędzie producenta jak karta techniczna. Scena to hala, panel to arkusz zamówienia,
     a pod sceną żyje rysunek wymiarowy zestawu (jedyny "głośny" element). Reszta spokojna. */
  :root {
    --zinc:#dce1e5;    /* ocynk: tło aplikacji i sceny */
    --sheet:#f7f8f9;   /* arkusz blachy: panel */
    --ink:#16283b;     /* tusz kreślarski: tekst, akcje */
    --steel:#56636f;   /* opisy */
    --rule:#c3cbd2;    /* linie */
    --signal:#f5b700;  /* żółć sygnałowa: zaznaczenie */
    --font:"Barlow Semi Condensed", "Arial Narrow", "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--zinc); color:var(--ink); font:16px/1.4 var(--font); }
  body { overflow-x:hidden; }
  :focus-visible { outline:3px solid var(--ink); outline-offset:2px; }
  .app { display:grid; grid-template-columns:minmax(0,1fr) 372px; height:100vh; }

  /* ---- Scena ---- */
  #view { position:relative; min-height:320px; overflow:hidden; }
  #view canvas { display:block; width:100%; height:100%; cursor:grab; }
  #view canvas:active { cursor:grabbing; }
  .badge { position:absolute; left:16px; top:14px; z-index:2; background:var(--signal); color:var(--ink); font-size:14px; font-weight:700; padding:3px 10px; border-radius:2px; }
  .hint { position:absolute; right:16px; top:14px; z-index:2; max-width:min(46ch, calc(100% - 230px)); text-align:right; color:var(--steel); font-size:14px; line-height:1.3; }

  /* Rysunek wymiarowy: rzut z przodu w skali, kliknięcie wybiera moduł */
  .dims { position:absolute; left:16px; right:16px; bottom:14px; z-index:2; max-width:760px; margin:0 auto; }
  .dims:empty { display:none; }
  .dim-mods { display:flex; height:46px; border:2px solid var(--ink); background:rgba(247,248,249,.82); }
  .dim-seg { flex:1 1 0; min-width:0; display:flex; align-items:center; justify-content:space-between; gap:4px; padding:0 8px;
    font:600 15px/1 var(--font); color:var(--ink); background:transparent; border:0; border-right:1px solid var(--ink); cursor:pointer; font-variant-numeric:tabular-nums; }
  .dim-seg:last-child { border-right:0; }
  .dim-seg b { font-weight:700; }
  .dim-seg span { color:var(--steel); font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:clip; }
  .dim-seg:hover { background:rgba(245,183,0,.25); }
  .dim-seg.on { background:var(--signal); }
  .dim-seg.on span { color:var(--ink); }
  .dim-seg:focus-visible { outline-offset:-5px; }
  .dim-total { position:relative; height:24px; margin:0 1px; }
  .dim-total::before { content:""; position:absolute; left:0; right:0; top:9px; border-top:1.5px solid var(--ink); }
  .dim-total::after { content:""; position:absolute; left:0; right:0; top:3px; height:13px; border-left:1.5px solid var(--ink); border-right:1.5px solid var(--ink); }
  .dim-total span { position:absolute; left:50%; top:0; transform:translateX(-50%); padding:0 8px; background:var(--sheet); border:1.5px solid var(--ink); border-radius:2px; font-weight:700; font-size:15px; line-height:18px; font-variant-numeric:tabular-nums; z-index:1; white-space:nowrap; }

  /* ---- Panel: arkusz zamówienia ---- */
  aside { background:var(--sheet); border-left:2px solid var(--ink); overflow:auto; display:flex; flex-direction:column; }
  .sheet { padding:22px 22px 8px; display:grid; gap:26px; align-content:start; }
  h1 { font-size:30px; line-height:1.02; font-weight:700; margin:0; letter-spacing:-.01em; max-width:12ch; }
  h2 { font-size:17px; font-weight:700; margin:0 0 10px; display:flex; align-items:baseline; gap:8px; }
  h2::before { content:""; width:10px; height:10px; background:var(--signal); border:1.5px solid var(--ink); flex:none; transform:translateY(-1px); }
  h2 + .swatches + h2 { margin-top:16px; }
  section { min-width:0; }

  button { font:inherit; color:var(--ink); cursor:pointer; }

  .add { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .add button { display:grid; grid-template-columns:30px 1fr; align-items:center; gap:10px; text-align:left; padding:9px 10px; min-height:64px;
    background:#fff; border:1.5px solid var(--rule); border-radius:3px; font-weight:600; font-size:15px; line-height:1.15; }
  .add button svg { width:30px; height:44px; color:var(--ink); }
  .add button small { display:block; font-weight:500; color:var(--steel); font-size:14px; margin-top:2px; font-variant-numeric:tabular-nums; }
  .add button:hover { border-color:var(--ink); }
  .add button:active { background:var(--zinc); }

  .mods { display:grid; gap:6px; }
  .mod { display:flex; align-items:center; gap:4px; padding:5px 5px 5px 0; background:#fff; border:1.5px solid var(--rule); border-radius:3px; cursor:pointer; }
  .mod > span { flex:1; min-width:0; font-weight:600; display:flex; align-items:baseline; gap:8px; }
  .mod > span i { font-style:normal; font-weight:700; min-width:30px; align-self:stretch; display:grid; place-items:center; border-right:1.5px solid var(--rule); margin:-5px 0; font-variant-numeric:tabular-nums; }
  .mod > span em { font-style:normal; font-weight:500; color:var(--steel); margin-left:auto; white-space:nowrap; font-variant-numeric:tabular-nums; }
  .mod.sel { border-color:var(--ink); box-shadow:inset 6px 0 0 var(--signal); }
  .mod.sel > span i { border-right-color:transparent; }
  .mod button { width:32px; height:32px; padding:0; display:grid; place-items:center; background:transparent; border:1.5px solid transparent; border-radius:3px; font-size:13px; color:var(--steel); flex:none; }
  .mod button:hover { border-color:var(--ink); color:var(--ink); }
  .mod button[data-act="del"]:hover { background:var(--ink); color:#fff; }
  .empty { color:var(--steel); margin:0; }

  .opts { display:grid; gap:12px; }
  label { display:block; font-size:15px; font-weight:500; color:var(--steel); }
  label b { color:var(--ink); font-variant-numeric:tabular-nums; }
  select, input[type=range] { width:100%; font:inherit; }
  input[type=range] { display:block; accent-color:var(--ink); margin:4px 0 0; height:24px; }

  .swatches { display:flex; gap:8px; flex-wrap:wrap; }
  .sw { display:grid; gap:4px; justify-items:start; padding:4px 4px 5px; background:#fff; border:1.5px solid var(--rule); border-radius:3px; font-size:13px; font-weight:600; min-width:74px; }
  .sw i { display:block; width:100%; height:24px; border-radius:1px; box-shadow:inset 0 0 0 1px rgba(22,40,59,.18); }
  .sw:hover { border-color:var(--ink); }
  .sw.on { border-color:var(--ink); box-shadow:0 0 0 2px var(--ink); }

  .sum { background:var(--ink); color:#fff; border-radius:3px; display:grid; grid-template-columns:1fr 1fr; font-variant-numeric:tabular-nums; }
  .sum div { display:flex; flex-direction:column-reverse; justify-content:flex-end; gap:2px; padding:12px 14px; border-top:1px solid rgba(255,255,255,.18); }
  .sum div:nth-child(-n+2) { border-top:0; }
  .sum div:nth-child(odd) { border-right:1px solid rgba(255,255,255,.18); }
  .sum span { font-size:14px; color:#c6d0da; line-height:1.2; }
  .sum b { font-size:28px; line-height:1; font-weight:700; }

  .row { position:sticky; bottom:0; margin-top:auto; display:grid; grid-template-columns:1fr 1.25fr; gap:8px; padding:12px 22px 16px; background:var(--sheet); border-top:1.5px solid var(--rule); }
  .row button { min-height:46px; padding:8px 12px; font-weight:700; font-size:16px; border-radius:3px; border:2px solid var(--ink); background:#fff; }
  .row button:hover { background:var(--zinc); }
  .row button.primary { background:var(--ink); color:#fff; }
  .row button.primary:hover { background:#24405d; }

  @media (max-width:980px) and (min-width:821px) { .app { grid-template-columns:minmax(0,1fr) 330px; } .hint { display:none; } }
  @media (max-width:820px) {
    .app { grid-template-columns:1fr; grid-template-rows:58vh auto; height:auto; }
    aside { border-left:0; border-top:2px solid var(--ink); overflow:visible; }
    .hint { left:16px; right:16px; top:auto; bottom:92px; max-width:none; text-align:left; font-size:13px; color:var(--ink); background:rgba(247,248,249,.85); padding:4px 8px; border-radius:2px; }
    .sheet { padding:20px 16px 8px; }
    .row { position:static; padding:12px 16px 20px; }
  }
  @media (max-width:420px) {
    .add button { grid-template-columns:22px 1fr; gap:8px; padding:8px; font-size:14px; }
    .add button svg { width:22px; height:34px; }
    .dims { left:10px; right:10px; }
    .dim-seg { padding:0 5px; font-size:14px; }
    .sum b { font-size:24px; }
    .row button { font-size:15px; padding:8px; }
  }
  @media (prefers-reduced-motion:reduce) { * { transition:none !important; animation:none !important; scroll-behavior:auto !important; } }
</style>
<style id="pf-bar">.pf-bar{position:relative;z-index:50;display:flex;justify-content:space-between;align-items:center;gap:10px;height:30px;padding:0 12px;background:#1f3a5f;color:#fff;font:600 13px/30px "Segoe UI",system-ui,Arial,sans-serif}.pf-bar a{color:#fff;text-decoration:none}.pf-bar a:hover{text-decoration:underline}.pf-bar span{opacity:.75;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}</style><style>.app{height:calc(100vh - 30px)}@media (max-width:820px){.app{height:auto}}</style>
</head>
<body>
<div class="pf-bar"><a href="./">← Marcin – wszystkie projekty</a><span>projekt demonstracyjny</span></div>
<div class="app">
  <div id="view"><span class="badge">DEMO – projekt przykładowy</span><span class="hint">Przeciągnij, aby obrócić · kółko / dwa palce, aby przybliżyć · kliknij moduł, aby go wybrać</span><div class="dims" id="dims" role="group" aria-label="Rzut z przodu: szerokości modułów"></div></div>
  <aside>
    <div class="sheet">
    <h1>Konfigurator automatów</h1>
    <section>
      <h2>Dodaj moduł</h2>
      <div class="add">
        <button data-add="terminal"><svg viewBox="0 0 30 44" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="4" y="1" width="22" height="40"/><rect x="7" y="6" width="16" height="11" fill="currentColor" fill-opacity=".18"/><rect x="12" y="21" width="6" height="3"/><rect x="7" y="29" width="16" height="3"/><path d="M5 43h20"/></svg><span>Terminal z ekranem<small>80 cm</small></span></button>
        <button data-add="lockers"><svg viewBox="0 0 30 44" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="1" y="1" width="28" height="40"/><path d="M15 4v34M4 4h22v34H4zM4 12.5h22M4 21h22M4 29.5h22"/><path d="M12 8v1.5M23 8v1.5M12 16.5V18M23 16.5V18M12 25v1.5M23 25v1.5M12 33.5V35M23 33.5V35" stroke-width="2"/><path d="M2 43h26"/></svg><span>Skrytki<small>100 cm</small></span></button>
        <button data-add="drawers"><svg viewBox="0 0 30 44" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="1" y="1" width="28" height="40"/><path d="M4 4h22v34H4zM4 10.8h22M4 17.6h22M4 24.4h22M4 31.2h22"/><path d="M11 6.5h8M11 13.3h8M11 20.1h8M11 26.9h8M11 33.7h8" stroke-width="2"/><path d="M2 43h26"/></svg><span>Szuflady<small>100 cm</small></span></button>
        <button data-add="shutter"><svg viewBox="0 0 30 44" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="1" y="1" width="28" height="40"/><path d="M4 8h6.7v30H4zM11.7 8h6.6v30h-6.6zM19.3 8H26v30h-6.7z"/><path d="M4 13h22M4 18h22M4 23h22M4 28h22M4 33h22" stroke-width=".9"/><path d="M2 43h26"/></svg><span>Roleta (3 kolumny)<small>120 cm</small></span></button>
      </div>
    </section>
    <section>
      <h2>Moduły w zestawie</h2>
      <div class="mods" id="mods"></div>
    </section>
    <section>
      <h2>Ustawienia wybranego modułu</h2>
      <div class="opts" id="opts"></div>
    </section>
    <section>
      <h2>Kolor obudowy</h2>
      <div class="swatches" id="bodySw"></div>
      <h2>Kolor frontów</h2>
      <div class="swatches" id="frontSw"></div>
    </section>
    <section>
      <h2>Podsumowanie</h2>
      <div class="sum" id="sum"></div>
    </section>
    </div>
    <div class="row">
      <button id="shot">Zapisz obraz PNG</button>
      <button class="primary" id="json">Zapisz konfigurację</button>
    </div>
  </aside>
</div>

<script>
// ===== Dane =====
const TYPES = {
  terminal: { name:'Terminal z ekranem', w:0.8 },
  lockers:  { name:'Skrytki', w:1.0 },
  drawers:  { name:'Szuflady', w:1.0 },
  shutter:  { name:'Roleta (3 kolumny)', w:1.2 },
};
const BODY_COLORS = { 'Grafit':'#3b4249', 'Biały':'#e9ecef', 'Niebieski':'#1f4f8f', 'Czerwony':'#a8322b' };
const FRONT_COLORS = { 'Pomarańczowy':'#e2681c', 'Szary':'#9aa3ad', 'Zielony':'#2f8f5b', 'Żółty':'#e8b923' };
const H = 2.0, D = 0.8, GAP = 0.02;
let state = { body:'#3b4249', front:'#e2681c', modules:[
  { id:1, type:'terminal' }, { id:2, type:'lockers', rows:6, cols:2 }, { id:3, type:'drawers', count:6 }, { id:4, type:'shutter' } ] };
let selected = 2, nextId = 5;

// ===== Scena =====
const view = document.getElementById('view');
const renderer = new THREE.WebGLRenderer({ antialias:true, preserveDrawingBuffer:true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
view.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color('#dce1e5');
const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 100);
scene.add(new THREE.HemisphereLight(0xffffff, 0x8a939c, 0.85));
const sun = new THREE.DirectionalLight(0xffffff, 0.75);
sun.position.set(4, 7, 6); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left:-6, right:6, top:6, bottom:-6 });
scene.add(sun);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.MeshStandardMaterial({ color:'#cbd2d8', roughness:1 }));
floor.rotation.x = -Math.PI/2; floor.receiveShadow = true; scene.add(floor);
const rig = new THREE.Group(); scene.add(rig);

function mat(color, rough=0.55, metal=0.25) { return new THREE.MeshStandardMaterial({ color, roughness:rough, metalness:metal }); }
function box(w, h, d, m, x, y, z, parent) {
  const b = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m);
  b.position.set(x, y, z); b.castShadow = true; b.receiveShadow = true; parent.add(b); return b;
}

function buildModule(m) {
  const t = TYPES[m.type], w = t.w, g = new THREE.Group();
  const body = mat(state.body), front = mat(state.front, 0.45, 0.3), dark = mat('#14181c', 0.3, 0.1), steel = mat('#c9ced3', 0.3, 0.8);
  box(w, H, D, body, 0, H/2 + 0.08, 0, g);                         // korpus
  box(w*0.96, 0.08, D*0.9, dark, 0, 0.04, 0, g);                   // cokół
  const fz = D/2 + 0.012;
  if (m.type === 'terminal') {
    box(w*0.7, 0.55, 0.03, dark, 0, 1.45, fz, g);                  // ekran
    box(w*0.6, 0.45, 0.01, mat('#2b8fd6', 0.2, 0), 0, 1.45, fz + 0.02, g);
    box(0.18, 0.1, 0.04, steel, 0, 1.0, fz, g);                    // czytnik kart
    box(w*0.7, 0.12, 0.05, dark, 0, 0.6, fz, g);                   // okno wydawania
  }
  if (m.type === 'lockers') {
    const rows = m.rows, cols = m.cols, top = 1.95, bot = 0.2, ch = (top-bot)/rows, cw = (w-0.08)/cols;
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
      const x = -w/2 + 0.04 + cw*c + cw/2, y = bot + ch*r + ch/2;
      box(cw-GAP, ch-GAP, 0.03, front, x, y + 0.08, fz, g);
      box(0.03, 0.06, 0.03, steel, x + cw/2 - 0.06, y + 0.08, fz + 0.025, g);
    }
  }
  if (m.type === 'drawers') {
    const n = m.count, top = 1.95, bot = 0.2, dh = (top-bot)/n;
    for (let i = 0; i < n; i++) {
      const y = bot + dh*i + dh/2 + 0.08;
      box(w-0.08, dh-GAP, 0.03, front, 0, y, fz, g);
      box(w*0.4, 0.025, 0.03, steel, 0, y + dh*0.25, fz + 0.025, g);
    }
  }
  if (m.type === 'shutter') {
    const cols = 3, cw = (w-0.08)/cols;
    for (let c = 0; c < cols; c++) {
      const x = -w/2 + 0.04 + cw*c + cw/2;
      box(cw-GAP*2, 1.6, 0.02, front, x, 1.15, fz, g);
      for (let s = 0; s < 22; s++) box(cw-GAP*2, 0.008, 0.026, dark, x, 0.37 + s*0.072, fz, g);
      box(0.1, 0.03, 0.03, steel, x, 0.42, fz + 0.02, g);
    }
  }
  g.userData.id = m.id;
  return g;
}

let frames = [];
function rebuild() {
  while (rig.children.length) rig.remove(rig.children[0]);
  frames = [];
  const total = state.modules.reduce((s, m) => s + TYPES[m.type].w, 0);
  let x = -total/2;
  state.modules.forEach(m => {
    const g = buildModule(m), w = TYPES[m.type].w;
    g.position.x = x + w/2; x += w; rig.add(g);
    if (m.id === selected) {
      const outline = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(w + 0.02, H + 0.12, D + 0.06)), new THREE.LineBasicMaterial({ color: state.front }));
      outline.position.set(g.position.x, H/2 + 0.06, 0); rig.add(outline);
    }
  });
  renderPanel();
}

// ===== Kamera (własne obracanie bez dodatkowych bibliotek) =====
let yaw = -0.45, pitch = 0.22, dist = 6.2;
function placeCamera() {
  const t = new THREE.Vector3(0, 1.0, 0);
  camera.position.set(t.x + dist*Math.sin(yaw)*Math.cos(pitch), t.y + dist*Math.sin(pitch), t.z + dist*Math.cos(yaw)*Math.cos(pitch));
  camera.lookAt(t);
}
let drag = null, moved = false;
const pointers = new Map();
renderer.domElement.addEventListener('pointerdown', e => { renderer.domElement.setPointerCapture(e.pointerId); pointers.set(e.pointerId, { x:e.clientX, y:e.clientY }); drag = { x:e.clientX, y:e.clientY }; moved = false; });
renderer.domElement.addEventListener('pointermove', e => {
  if (!pointers.has(e.pointerId)) return;
  const prev = pointers.get(e.pointerId);
  if (pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    const before = Math.hypot(a.x - b.x, a.y - b.y);
    pointers.set(e.pointerId, { x:e.clientX, y:e.clientY });
    const [c, d] = [...pointers.values()];
    const after = Math.hypot(c.x - d.x, c.y - d.y);
    dist = Math.min(12, Math.max(2.5, dist * before / after)); moved = true; return;
  }
  const dx = e.clientX - prev.x, dy = e.clientY - prev.y;
  if (Math.abs(dx) + Math.abs(dy) > 2) moved = true;
  yaw -= dx * 0.008; pitch = Math.min(1.2, Math.max(0.02, pitch + dy * 0.006));
  pointers.set(e.pointerId, { x:e.clientX, y:e.clientY });
});
renderer.domElement.addEventListener('pointerup', e => {
  pointers.delete(e.pointerId);
  if (!moved && drag) pick(e);
  drag = null;
});
renderer.domElement.addEventListener('wheel', e => { e.preventDefault(); dist = Math.min(12, Math.max(2.5, dist * (1 + Math.sign(e.deltaY) * 0.08))); }, { passive:false });

const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
function pick(e) {
  const r = renderer.domElement.getBoundingClientRect();
  ndc.set(((e.clientX - r.left)/r.width)*2 - 1, -((e.clientY - r.top)/r.height)*2 + 1);
  ray.setFromCamera(ndc, camera);
  const hit = ray.intersectObjects(rig.children, true)[0];
  if (!hit) return;
  let o = hit.object; while (o && o.parent !== rig) o = o.parent;
  if (o && o.userData.id) { selected = o.userData.id; rebuild(); }
}

function resize() {
  const w = view.clientWidth, h = view.clientHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
(function loop() { placeCamera(); renderer.render(scene, camera); requestAnimationFrame(loop); })();

// ===== Panel =====
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cm = w => (w*100).toFixed(0);
function compartments(m) { return m.type === 'lockers' ? m.rows*m.cols : m.type === 'drawers' ? m.count : m.type === 'shutter' ? 3 : 0; }
function renderPanel() {
  const mods = document.getElementById('mods');
  mods.innerHTML = state.modules.map((m, i) => `<div class="mod ${m.id===selected?'sel':''}" data-id="${m.id}">
      <span><i>${i+1}.</i> ${esc(TYPES[m.type].name)} <em>${cm(TYPES[m.type].w)} cm</em></span>
      <button data-act="left" title="Przesuń w lewo" aria-label="Przesuń moduł ${i+1} w lewo">◀</button><button data-act="right" title="Przesuń w prawo" aria-label="Przesuń moduł ${i+1} w prawo">▶</button><button data-act="del" title="Usuń" aria-label="Usuń moduł ${i+1}">✕</button></div>`).join('')
    || '<p class="empty">Brak modułów. Dodaj pierwszy powyżej.</p>';
  const m = state.modules.find(x => x.id === selected), opts = document.getElementById('opts');
  if (!m) opts.innerHTML = '<p class="empty">Wybierz moduł z listy lub kliknij go na podglądzie.</p>';
  else if (m.type === 'lockers') opts.innerHTML = `<label>Liczba rzędów: <b>${m.rows}</b><input type="range" min="2" max="10" value="${m.rows}" data-opt="rows"></label><label>Liczba kolumn: <b>${m.cols}</b><input type="range" min="1" max="3" value="${m.cols}" data-opt="cols"></label>`;
  else if (m.type === 'drawers') opts.innerHTML = `<label>Liczba szuflad: <b>${m.count}</b><input type="range" min="3" max="10" value="${m.count}" data-opt="count"></label>`;
  else opts.innerHTML = `<p class="empty">${esc(TYPES[m.type].name)} nie ma dodatkowych ustawień w wersji demo.</p>`;
  const width = state.modules.reduce((s, x) => s + TYPES[x.type].w, 0);
  const comp = state.modules.reduce((s, x) => s + compartments(x), 0);
  document.getElementById('sum').innerHTML = `<div><span>Liczba modułów</span><b>${state.modules.length}</b></div><div><span>Szerokość zestawu</span><b>${(width*100).toFixed(0)} cm</b></div><div><span>Wysokość</span><b>${((H+0.08)*100).toFixed(0)} cm</b></div><div><span>Liczba skrytek / szuflad</span><b>${comp}</b></div>`;
  swatches('bodySw', BODY_COLORS, 'body'); swatches('frontSw', FRONT_COLORS, 'front');
  renderDims(width);
}
function swatches(id, list, key) {
  document.getElementById(id).innerHTML = Object.entries(list).map(([n, c]) => `<button class="sw ${state[key]===c?'on':''}" title="${n}" aria-pressed="${state[key]===c}" data-key="${key}" data-color="${c}"><i style="background:${c}"></i>${n}</button>`).join('');
}
// Rysunek wymiarowy pod sceną (te same dane co podsumowanie)
function renderDims(width) {
  const el = document.getElementById('dims');
  el.innerHTML = state.modules.length ? `<div class="dim-mods">${state.modules.map((m, i) => `<button type="button" class="dim-seg ${m.id===selected?'on':''}" style="flex-grow:${TYPES[m.type].w}" data-id="${m.id}" aria-pressed="${m.id===selected}" aria-label="Moduł ${i+1}: ${esc(TYPES[m.type].name)}, ${cm(TYPES[m.type].w)} cm"><b>${i+1}</b><span>${cm(TYPES[m.type].w)}</span></button>`).join('')}</div><div class="dim-total"><span>${cm(width)} cm</span></div>` : '';
}
document.getElementById('dims').addEventListener('click', e => {
  const seg = e.target.closest('.dim-seg');
  if (seg) { selected = +seg.dataset.id; rebuild(); document.querySelector(`.dim-seg[data-id="${selected}"]`)?.focus(); }
});
document.querySelector('aside').addEventListener('click', e => {
  const add = e.target.closest('[data-add]');
  if (add) { const t = add.dataset.add, m = { id:nextId++, type:t }; if (t==='lockers') Object.assign(m, { rows:6, cols:2 }); if (t==='drawers') m.count = 6; state.modules.push(m); selected = m.id; rebuild(); return; }
  const sw = e.target.closest('.sw');
  if (sw) { state[sw.dataset.key] = sw.dataset.color; rebuild(); return; }
  const row = e.target.closest('.mod');
  if (row) {
    const id = +row.dataset.id, i = state.modules.findIndex(m => m.id === id), act = e.target.closest('[data-act]')?.dataset.act;
    if (act === 'del') { state.modules.splice(i, 1); if (selected === id) selected = state.modules[0]?.id; }
    else if (act === 'left' && i > 0) [state.modules[i-1], state.modules[i]] = [state.modules[i], state.modules[i-1]];
    else if (act === 'right' && i < state.modules.length-1) [state.modules[i+1], state.modules[i]] = [state.modules[i], state.modules[i+1]];
    else selected = id;
    rebuild();
  }
});
document.getElementById('opts').addEventListener('input', e => {
  const m = state.modules.find(x => x.id === selected); if (!m || !e.target.dataset.opt) return;
  m[e.target.dataset.opt] = +e.target.value; rebuild();
});
function download(name, url) { const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); }
document.getElementById('shot').addEventListener('click', () => download('konfiguracja.png', renderer.domElement.toDataURL('image/png')));
document.getElementById('json').addEventListener('click', () => {
  const data = { kolorObudowy: state.body, kolorFrontow: state.front, moduly: state.modules.map(m => ({ typ: TYPES[m.type].name, ...(m.rows ? { rzedy:m.rows, kolumny:m.cols } : {}), ...(m.count ? { szuflady:m.count } : {}) })) };
  download('konfiguracja.json', URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type:'application/json' })));
});

resize();
// Węższy ekran (telefon): kamera startuje dalej, żeby cały zestaw mieścił się w kadrze
if (camera.aspect < 1.1) dist = Math.min(12, 6.2 * 1.1 / camera.aspect);
rebuild();
</script>
</body>
</html>
