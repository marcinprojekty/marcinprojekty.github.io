<!doctype html>
<html lang="pl" data-theme="noc">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050506">
<meta name="description" content="Forma – aplikacja treningowa (demo): plan z 14 metod, rekordy, mapa mięśni, dieta z adaptacyjnym TDEE, suplementy i koszyk.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Forma">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Forma – demo</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230c0d0f'/%3E%3Cpath d='M5 17h5l3-7 5 13 3-6h6' fill='none' stroke='%2393a8c4' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<canvas id="stars" aria-hidden="true"></canvas>
<div class="shell">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <svg width="22" height="22" viewBox="0 0 32 32" aria-hidden="true"><path d="M3 17h6l3-7 5 13 3-6h9" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Forma
    </div>
    <nav class="nav" id="nav" aria-label="Sekcje"></nav>
    <div class="foot nav"><a href="#/ustawienia" data-route="ustawienia"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Ustawienia</a></div>
  </aside>
  <header class="topbar">
    <button class="btn small menu-btn" id="menuBtn" aria-label="Menu" aria-expanded="false"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <div class="fresh" id="fresh"></div>
    <div class="spacer"></div>
    <div class="themes" id="themes" aria-label="Motyw"></div>
    <button class="btn primary small" id="logBtn">Wpis dnia</button>
  </header>
  <main id="main" tabindex="-1"></main>
</div>

<dialog id="logDialog" aria-labelledby="logTitle">
  <form method="dialog" id="logForm">
    <h2 id="logTitle">Wpis dnia</h2>
    <div class="form-grid">
      <label class="field full">Dzień<input type="date" name="date" required></label>
      <label class="field">Waga rano (kg)<input type="number" name="w" step="0.1" min="30" max="200" inputmode="decimal"></label>
      <label class="field">Kalorie (kcal)<input type="number" name="kcal" step="1" min="0" max="10000" inputmode="numeric"></label>
      <label class="field">Białko (g)<input type="number" name="p" step="1" min="0" max="500" inputmode="numeric"></label>
      <label class="field">Tłuszcz (g)<input type="number" name="fat" step="1" min="0" max="500" inputmode="numeric"></label>
      <label class="field">Węglowodany (g)<input type="number" name="carb" step="1" min="0" max="1500" inputmode="numeric"></label>
      <label class="field">Kroki<input type="number" name="steps" step="1" min="0" max="100000" inputmode="numeric"></label>
      <label class="field full">Notatka<textarea name="note" rows="2" placeholder="Jak poszło, co było trudne"></textarea></label>
    </div>
    <div class="dialog-actions">
      <button class="btn" type="button" data-close>Anuluj</button>
      <button class="btn primary" value="save">Zapisz</button>
    </div>
  </form>
</dialog>

<dialog id="editDialog" aria-labelledby="editTitle"><form method="dialog" id="editForm"></form></dialog>
<input type="file" id="fileCsv" accept=".csv,text/csv" hidden>
<input type="file" id="fileInbox" multiple accept=".csv,text/csv,.json,application/json" hidden>
<input type="file" id="fileJson" accept=".json,application/json" hidden>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="vendor/motion.js"></script>
<script src="charts.js"></script>
<script src="data.js"></script>
<script src="methods.js"></script>
<script src="anatomy.js"></script>
<script src="app.js"></script>
</body>
</html>
