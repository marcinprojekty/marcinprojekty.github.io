<style>

@font-face{font-family:'Rajdhani';font-style:normal;font-weight:600;font-display:swap;src:url(fonts/rajdhani-600-latin.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}

@font-face{font-family:'Archivo';font-style:normal;font-weight:400 600;font-display:swap;src:url(fonts/archivo-latin-ext.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C4,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'Archivo';font-style:normal;font-weight:400 600;font-display:swap;src:url(fonts/archivo-latin.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}

/* paleta: biel + mgła (spokojne), zieleń Bomet (mocny akcent) */
:root{
  --paper:#FFFFFF; --mist:#EEF2EF; --mist-2:#E3E9E5;
  --ink:#1E2622; --ink-2:#4C5751; --ink-3:#5A665F; --line:#D6DED9; --line-2:#B9C4BD;
  --green:#149747; --green-d:#0B7A34; --green-dd:#086329;
  --err:#B42318;
  --disp:"Rajdhani","Arial Narrow",system-ui,sans-serif;
  --r:6px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:calc(var(--hh,64px) + 12px)}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.55 Archivo,system-ui,sans-serif;overflow-x:hidden}
img{display:block;max-width:100%;height:auto}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid var(--green);outline-offset:2px}
[tabindex="-1"]:focus{outline:0}
h1,h2,h3{font-family:var(--disp);font-weight:700;margin:0;line-height:1;letter-spacing:0}
p{margin:0;text-wrap:pretty}
h2,h3{text-wrap:balance}
.wrap{max-width:1240px;margin:0 auto;padding:0 32px}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
[hidden]{display:none!important}
.hy{hyphens:auto;-webkit-hyphens:auto;overflow-wrap:anywhere}

/* pasek demo */
.demobar{background:var(--mist);color:var(--ink-2);font-size:14px}
.demobar .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 16px;padding-top:8px;padding-bottom:8px}
.demobar b{color:var(--ink);font-weight:600}
.demobar a{color:var(--ink);text-underline-offset:3px}

/* nagłówek */
header.site{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line);backdrop-filter:saturate(1.2) blur(6px)}
header.site .wrap{display:flex;align-items:center;gap:16px;min-height:64px}
.brand{display:flex;align-items:center;gap:14px;text-decoration:none;min-width:0}
.brand img{height:28px;width:auto;flex:none}
.brand span{font-family:var(--disp);font-weight:600;font-size:21px;color:var(--ink-2);border-left:1px solid var(--line-2);padding-left:14px;line-height:1.1;white-space:nowrap}
.tools{margin-left:auto;display:flex;align-items:center;gap:8px;flex:none}
.langs{display:flex}
.langs button{border:0;background:none;padding:8px 9px;font-family:var(--disp);font-weight:700;font-size:18px;color:var(--ink-3);border-radius:4px;min-width:40px;min-height:40px}
.langs button[aria-pressed=true]{color:var(--ink);text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:5px;text-decoration-color:var(--green)}
.langs button:hover{color:var(--ink)}
.cartbtn{display:flex;align-items:center;gap:10px;border:0;background:var(--green-d);color:#fff;border-radius:var(--r);padding:0 14px;height:44px;font-weight:600;white-space:nowrap}
.cartbtn:hover{background:var(--green-dd)}
.cartbtn .cnt{min-width:24px;height:24px;border-radius:12px;background:#fff;color:var(--green-d);font-size:13.5px;font-weight:700;display:grid;place-items:center;padding:0 7px}
.cartbtn .tot{font-family:var(--disp);font-weight:700;font-size:19px;letter-spacing:.01em}
.cartbtn svg{flex:none}

/* hero – jedyny mocny moment */
.hero{background:linear-gradient(160deg,var(--paper) 38%,var(--mist) 100%);border-bottom:1px solid var(--line);padding:clamp(40px,5vw,72px) 0}
.hero .wrap{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px 48px;align-items:center}
.hero h1{font-size:clamp(46px,7.6vw,124px);line-height:.86;text-transform:uppercase;letter-spacing:-.005em;max-width:9.5em}
.hero h1 .l{display:block}
.hero .lead{margin-top:clamp(18px,2vw,28px);font-size:clamp(17px,1.4vw,20px);color:var(--ink-2);max-width:33em}
.steps{list-style:none;margin:clamp(24px,2.6vw,36px) 0 0;padding:0;display:flex;flex-wrap:wrap;gap:12px 36px}
.steps li{display:flex;align-items:baseline;gap:10px;font-weight:600}
.steps b{font-family:var(--disp);font-size:30px;line-height:1;color:var(--green-d);min-width:.75em}
.cta{margin-top:clamp(26px,2.6vw,36px);display:flex;flex-wrap:wrap;gap:12px 22px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 22px;border:0;border-radius:var(--r);background:var(--green-d);color:#fff;font-weight:600;font-size:16.5px;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--green-dd)}
.link{background:none;border:0;padding:6px 0;font-weight:600;color:var(--ink);text-decoration:underline;text-decoration-color:var(--line-2);text-decoration-thickness:2px;text-underline-offset:5px}
.link:hover{text-decoration-color:var(--green)}
.hero figure{margin:0;width:clamp(200px,27vw,380px)}
.hero figure img{width:100%;filter:drop-shadow(0 24px 30px rgba(30,38,34,.16))}

/* sekcje */
.block{padding:clamp(56px,7vw,104px) 0 0}
.shead{display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:14px;align-items:baseline;margin-bottom:28px}
.shead .no{font-family:var(--disp);font-weight:700;font-size:clamp(34px,3.4vw,48px);color:var(--green-d);line-height:1}
.shead h2{font-size:clamp(34px,3.4vw,48px);text-transform:uppercase}
.shead p{grid-column:1/-1;margin-top:12px;color:var(--ink-2);max-width:40em}

/* maszyny */
.machines{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:16px}
.mcard{position:relative;display:flex;flex-direction:column;text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:0 0 16px;overflow:hidden;min-width:0}
.mcard:hover{border-color:var(--line-2)}
.mcard img{width:100%;aspect-ratio:4/3;object-fit:contain;padding:4px}
.mcard .n{font-family:var(--disp);font-weight:700;font-size:27px;line-height:1;padding:4px 16px 0}
.mcard .d{padding:4px 16px 0;color:var(--ink-2);font-size:15px;line-height:1.35}
.mcard .s{padding:6px 16px 0;color:var(--ink-3);font-size:13.5px}
.mcard .tick{position:absolute;top:10px;right:10px;width:30px;height:30px;border-radius:50%;background:var(--green-d);display:none;place-items:center}
.mcard[aria-pressed=true]{border-color:var(--green);box-shadow:inset 0 0 0 1px var(--green)}
.mcard[aria-pressed=true] .tick{display:grid}

/* części */
.pbar{display:flex;flex-wrap:wrap;align-items:center;gap:14px 20px;padding-bottom:20px}
.pbar img{width:96px;height:72px;object-fit:contain;flex:none;border:1px solid var(--line);border-radius:4px}
.pbar .who{display:flex;align-items:center;gap:16px;min-width:0;flex:1 1 320px}
.pbar .who b{display:block;font-family:var(--disp);font-size:28px;line-height:1.05}
.pbar .who span{display:block;color:var(--ink-2);font-size:14.5px;margin-top:3px}
.search{display:flex;align-items:center;gap:10px;border:1px solid var(--line-2);border-radius:var(--r);background:var(--paper);height:54px;padding:0 8px 0 16px}
.search:focus-within{outline:3px solid var(--green);outline-offset:1px;border-color:var(--green)}
.search input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:17px;height:100%}
.search input::placeholder{color:var(--ink-3)}
.search input::-webkit-search-cancel-button{display:none}
.qclear{border:0;background:none;width:40px;height:40px;border-radius:4px;font-size:24px;line-height:1;color:var(--ink-2)}
.qclear:hover{background:var(--mist)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{border:1px solid var(--line-2);background:var(--paper);border-radius:999px;padding:7px 14px;font-size:14.5px;font-weight:600;color:var(--ink-2);min-height:38px}
.chip:hover{border-color:var(--ink-3);color:var(--ink)}
.chip[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.notice{margin-top:14px;padding:12px 16px;background:var(--mist);border-radius:var(--r);color:var(--ink);font-size:15px;display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline}
.notice .link{padding:0;font-size:15px}
.plist{list-style:none;margin:0;padding:0}
.phead[hidden]+.plist,.plist:first-child{border-top:1px solid var(--ink)}
.phead,.prow{display:grid;grid-template-columns:150px minmax(0,1fr) 190px 250px;gap:8px 24px;align-items:center}
.phead{margin-top:18px;padding:10px 0;font-size:13.5px;color:var(--ink-3);border-bottom:1px solid var(--ink)}
.phead .r,.prow .price{text-align:right}
.prow{padding:16px 0;border-bottom:1px solid var(--line)}
.pn{font-family:var(--disp);font-weight:600;font-size:18px;color:var(--ink-2);white-space:nowrap}
.pname{font-weight:600;line-height:1.35}
.pmeta{font-size:13.5px;color:var(--ink-3);margin-top:3px}
.mtag{display:inline-block;font-family:var(--disp);font-weight:700;font-size:15px;background:var(--mist-2);color:var(--ink);border-radius:3px;padding:0 6px;margin:2px 4px 0 0}
.price strong{display:block;font-family:var(--disp);font-weight:700;font-size:28px;line-height:1;white-space:nowrap}
.price small{display:block;font-size:13.5px;color:var(--ink-3);margin-top:4px;white-space:nowrap}
.buy{display:flex;gap:8px;justify-content:flex-end;align-items:center}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line-2);border-radius:var(--r);height:44px;background:var(--paper);flex:none}
.qty button{width:38px;height:42px;border:0;background:none;font-size:20px;color:var(--ink-2);border-radius:var(--r)}
.qty button:hover{background:var(--mist);color:var(--ink)}
.qty input{width:48px;height:42px;border:0;text-align:center;font-weight:600;font-size:16px;background:transparent;-moz-appearance:textfield;appearance:textfield}
.qty input::-webkit-outer-spin-button,.qty input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.add{height:44px;min-width:112px;padding:0 16px;border:1px solid var(--green-d);border-radius:var(--r);background:var(--paper);color:var(--green-d);font-weight:600;white-space:nowrap}
.add:hover{background:var(--green-d);color:#fff}
.add.ok{background:var(--green-d);color:#fff}
.empty{padding:28px 0;color:var(--ink-2);border-bottom:1px solid var(--line)}
.vatnote{margin-top:14px;font-size:14px;color:var(--ink-3)}

/* po zamówieniu */
.after{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px 48px}
.after h3{font-size:24px;margin-bottom:8px}
.after p{color:var(--ink-2);max-width:30em}

/* stopka */
footer{margin-top:clamp(64px,8vw,120px);border-top:1px solid var(--line);background:var(--mist);padding:40px 0 48px;font-size:15px;color:var(--ink-2)}
footer .wrap{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:24px 40px}
footer h2{font-size:22px;color:var(--ink);margin-bottom:8px}
footer a{color:var(--ink);text-underline-offset:3px}
footer p+p{margin-top:3px}

/* koszyk */
.shade{position:fixed;inset:0;background:rgba(30,38,34,.42);z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}
.shade.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(480px,100%);background:var(--paper);z-index:61;transform:translateX(100%);visibility:hidden;transition:transform .26s cubic-bezier(.2,.8,.2,1),visibility 0s .26s;display:flex;flex-direction:column}
.drawer.open{transform:none;visibility:visible;transition:transform .26s cubic-bezier(.2,.8,.2,1),visibility 0s}
.dh{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 14px 24px;border-bottom:1px solid var(--line)}
.dh h2{font-size:30px;text-transform:uppercase}
.x{border:0;background:none;width:44px;height:44px;border-radius:var(--r);font-size:30px;line-height:1;color:var(--ink-2)}
.x:hover{background:var(--mist)}
.dbody{flex:1;overflow:auto;padding:4px 24px 28px;overscroll-behavior:contain}
.citem{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;padding:16px 0;border-bottom:1px solid var(--line)}
.citem .n{font-weight:600;line-height:1.35}
.citem .m{font-size:13.5px;color:var(--ink-3)}
.citem .lt{font-family:var(--disp);font-weight:700;font-size:21px;line-height:1.2;white-space:nowrap;text-align:right}
.citem .lt small{display:block;font:400 13px/1.3 Archivo,system-ui,sans-serif;color:var(--ink-3)}
.citem .r{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:10px}
.citem .qty{height:38px}.citem .qty button{height:36px;width:34px}.citem .qty input{height:36px}
.rm{border:0;background:none;padding:8px 0;color:var(--ink-2);text-decoration:underline;text-underline-offset:3px;font-size:14px}
.rm:hover{color:var(--err)}
.sums{margin-top:16px;font-size:15px}
.sums div{display:flex;justify-content:space-between;gap:12px;padding:3px 0}
.sums .tot{margin-top:6px;padding-top:10px;border-top:1px solid var(--ink);font-weight:600;align-items:baseline}
.sums .tot span:last-child{font-family:var(--disp);font-weight:700;font-size:30px}
.cempty{padding:32px 0;color:var(--ink-2)}
.cempty .btn{margin-top:18px}
.oform{margin-top:28px;display:grid;gap:14px}
.oform h3{font-size:26px;text-transform:uppercase}
.oform fieldset{border:0;margin:0;padding:0;display:grid;gap:10px;min-width:0}
.oform legend{padding:0;margin-bottom:8px;font-weight:600;font-size:15px}
.mset{background:var(--mist);border-radius:var(--r);padding:14px 16px 16px!important}
.mset legend{float:left;width:100%;margin-bottom:10px}
.mset legend b{font-family:var(--disp);font-size:22px}
.mset legend span{color:var(--ink-2);font-weight:400}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:end}
.oform label{display:grid;gap:4px;font-size:14px;font-weight:600;color:var(--ink-2);min-width:0}
.oform label i{font-style:normal;font-weight:400;color:var(--ink-3)}
.oform input,.oform select,.oform textarea{width:100%;min-width:0;border:1px solid var(--line-2);border-radius:var(--r);padding:10px 12px;font-size:16px;font-weight:400;color:var(--ink);background:var(--paper);min-height:46px}
.oform textarea{min-height:70px;resize:vertical}
.oform [aria-invalid=true]{border-color:var(--err);box-shadow:inset 0 0 0 1px var(--err)}
.seg{display:grid;grid-auto-columns:minmax(0,1fr);grid-auto-flow:column;border:1px solid var(--line-2);border-radius:var(--r);overflow:hidden}
.seg button{border:0;border-left:1px solid var(--line-2);background:var(--paper);padding:10px 6px;font-weight:600;font-size:14.5px;color:var(--ink-2);min-height:46px;line-height:1.2}
.seg button:first-child{border-left:0}
.seg button[aria-pressed=true]{background:var(--ink);color:#fff}
.err{color:var(--err);font-weight:600;font-size:15px}
.err:empty{display:none}
.oform .btn{width:100%;min-height:54px;font-size:17px}
.dfoot{font-size:13.5px;color:var(--ink-3)}

/* toast i okno potwierdzenia */
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,16px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:var(--r);font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:80;max-width:calc(100% - 32px);width:max-content}
.toast.show{opacity:1;transform:translate(-50%,0)}
.modal{position:fixed;inset:0;background:rgba(30,38,34,.55);display:none;place-items:center;z-index:90;padding:16px;overflow:auto}
.modal.open{display:grid}
.modal .box{background:var(--paper);border-radius:8px;max-width:520px;width:100%;padding:28px}
.modal h2{font-size:32px;text-transform:uppercase;margin-bottom:10px}
.modal p{color:var(--ink-2)}
.modal pre{margin:16px 0 20px;padding:14px 16px;background:var(--mist);border-radius:var(--r);font:400 14px/1.55 Archivo,system-ui,sans-serif;white-space:pre-wrap;overflow-wrap:anywhere;max-height:40vh;overflow:auto;color:var(--ink)}

/* responsywność */
@media (max-width:1180px){
  .machines{grid-template-columns:repeat(4,minmax(0,1fr))}
  .phead,.prow{grid-template-columns:130px minmax(0,1fr) 170px 236px;gap:8px 18px}
}
@media (max-width:980px){
  .machines{grid-template-columns:repeat(3,minmax(0,1fr))}
  .phead{display:none}
  .plist{margin-top:18px;border-top:1px solid var(--ink)}
  .prow{grid-template-columns:minmax(0,1fr) auto;gap:10px 16px;align-items:start}
  .prow .c-nr{grid-column:1;grid-row:1}
  .prow .c-name{grid-column:1;grid-row:2}

const L = () => T[lang];
const M = id => DATA.machines.find(m => m.id === id);
const P = DATA.parts.map(([nr, t, pl, de, price, refs]) => ({ nr, t, pl, de, price, refs }));
const byNr = new Map(P.map(p => [p.nr, p]));
const ORDER = ['work', 'disc', 'safety', 'bearing', 'wheel', 'drive', 'body', 'fix'];

const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const pname = p => cap(lang === 'de' ? p.de : p.pl);
const mname = m => lang === 'de' && m.nameDe ? m.nameDe : m.name;
const mtype = m => lang === 'de' ? m.de : m.pl;
const mspec = m => lang === 'de' ? m.specDe : m.specPl;
const vat = () => lang === 'de' ? 0.19 : 0.23;
const r2 = v => Math.round((v + Number.EPSILON) * 100) / 100;
const unit = zl => r2(lang === 'de' ? zl / EUR : zl);               // cena sztuki netto w walucie, zaokrąglona
const unitGross = zl => r2(unit(zl) * (1 + vat()));
const fmt = v => lang === 'de'
  ? v.toLocaleString('de-DE', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' €'
  : v.toLocaleString('pl-PL', { minimumFractionDigits: 2, maximumFractionDigits: 2, useGrouping: true }).replace(/(\d)\s(\d{3})(?=,)/, '$1 $2') + ' zł';
const norm = s => String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/ł/g, 'l').replace(/ß/g, 'ss').replace(/×/g, 'x').replace(/[‐-―−]/g, '-');
const fitsCur = p => p.refs.includes(current);

/* fokus wraca na ten sam element po przerysowaniu */
function focusKey(el) {
  if (!el || el === document.body) return null;
  if (el.id) return '#' + CSS.escape(el.id);
  for (const a of ['m', 't', 'dec', 'inc', 'q', 'add', 'cdec', 'cinc', 'cq', 'rm', 'buyer', 'del', 'msym', 'myear', 'mserial', 'scope'])
    if (el.dataset && el.dataset[a] !== undefined) return `[data-${a}="${CSS.escape(el.dataset[a])}"]`;
  return null;
}
function keepFocus(fn, fallback) {
  const k = focusKey(document.activeElement); fn();
  const el = (k && document.querySelector(k)) || (fallback && document.querySelector(fallback));
  if (el && el !== document.activeElement) el.focus({ preventScroll: true });
}

/* ilość: liczba całkowita 1–999 */
function readQty(v) {
  const s = String(v).trim(), n = Number(s);
  if (/^\d+$/.test(s) && n >= 1 && n <= MAXQ) return { v: n, fixed: false };
  const f = Number.isFinite(n) ? Math.round(n) : 1;
  return { v: Math.max(1, Math.min(MAXQ, f || 1)), fixed: true };
}

/* 1. maszyny */
function renderMachines() {
  $('#machines').innerHTML = DATA.machines.map(m => {
    const n = P.filter(p => p.refs.includes(m.id)).length;
    return `<button type="button" class="mcard" data-m="${esc(m.id)}" aria-pressed="${m.id === current}">
      <img src="img/${esc(m.id)}.webp" width="720" height="540" alt="" loading="lazy" decoding="async">
      <span class="n hy">${esc(mname(m))}</span><span class="d hy">${esc(mtype(m))}</span><span class="s">${esc(L().parts(n))}</span>
      <span class="tick" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3"><path d="m5 12 5 5 9-10"/></svg></span></button>`;
  }).join('');
  nbsp($('#machines'));
}
$('#machines').addEventListener('click', e => {
  const b = e.target.closest('[data-m]'); if (!b) return;
  current = b.dataset.m; type = 'all'; scope = 'machine'; setQuery('');
  renderMachines(); renderParts();
  const h = $('#s2h'); h.focus({ preventScroll: true });
  document.getElementById('czesci').scrollIntoView({ block: 'start' });
});

/* 2. części */
function matches(p) {
  // proste ucinanie końcówek: „łożysko” znajdzie też „łożyskiem”, „sprężyna” – „sprężyny”
  const words = norm(query).split(/\s+/).filter(Boolean).map(w => w.length >= 5 ? w.replace(/[aeiouy]+$/, '') : w);
  const hay = norm(p.nr) + ' ' + norm(p.pl) + ' ' + norm(p.de), flat = hay.replace(/[-\s.]/g, '');
  return words.every(w => hay.includes(w) || flat.includes(w.replace(/[-.]/g, '')));
}
const sortParts = list => list.sort((a, b) => ORDER.indexOf(a.t) - ORDER.indexOf(b.t) || a.nr.localeCompare(b.nr));
function visibleParts() {
  if (query) return sortParts(P.filter(p => matches(p) && (scope === 'all' || fitsCur(p))));
  return sortParts(P.filter(p => fitsCur(p) && (type === 'all' || p.t === type)));
}
function rowHTML(p) {
  const q = draft.get(p.nr) || 1, name = esc(pname(p));
  const tags = scope === 'all' && query ? `<div class="pmeta">${esc(L().fits)} ${p.refs.map(id => `<span class="mtag">${esc(mname(M(id)))}</span>`).join('')}</div>` : `<div class="pmeta">${esc(L().types[p.t])}</div>`;
  return `<li class="prow">
    <div class="c-nr"><span class="pn num">${esc(p.nr)}</span></div>
    <div class="c-name"><div class="pname hy">${name}</div>${tags}</div>
    <div class="price"><strong class="num">${fmt(unitGross(p.price))}</strong><small class="num">${fmt(unit(p.price))} ${esc(L().net)}</small></div>
    <div class="c-buy"><div class="buy">
      <span class="qty"><button type="button" data-dec="${esc(p.nr)}" aria-label="${esc(L().dec)}">−</button><input class="num" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="4" value="${q}" data-q="${esc(p.nr)}" aria-label="${esc(L().qtyAria(pname(p)))}"><button type="button" data-inc="${esc(p.nr)}" aria-label="${esc(L().inc)}">+</button></span>
      <button type="button" class="add" data-add="${esc(p.nr)}" aria-label="${esc(L().addAria(pname(p)))}">${esc(L().add)}</button>
    </div></div>
  </li>`;
}
function renderParts() {
  const m = M(current), list = visibleParts();
  $('#pbar').innerHTML = `<div class="who"><img src="img/${esc(m.id)}.webp" width="96" height="72" alt=""><div><b class="hy">${esc(mname(m))} – ${esc(lang === 'pl' ? mtype(m).toLowerCase() : mtype(m))}</b><span>${esc(mspec(m))}. ${esc(L().symbols)}: ${m.symbols.map(esc).join(', ')}</span></div></div><button type="button" class="link" id="changeM">${esc(L().change)}</button>`;
  // filtry rodzajów tylko bez wyszukiwania
  const inM = P.filter(fitsCur);
  const types = ['all', ...ORDER.filter(t => inM.some(p => p.t === t))];
  $('#chips').hidden = !!query;
  $('#chips').setAttribute('aria-label', L().typesAria);
  $('#chips').innerHTML = types.map(t => `<button type="button" class="chip" data-t="${t}" aria-pressed="${t === type}">${esc(L().types[t])}</button>`).join('');
  // komunikat o wynikach w innych maszynach
  const nt = $('#notice');
  let other = 0;
  if (query) {
    other = P.filter(p => matches(p) && !fitsCur(p)).length;
    if (scope === 'all') nt.innerHTML = `<span>${esc(L().hitsAll(list.length))}</span><button type="button" class="link" data-scope="machine">${esc(L().onlyM(mname(m)))}</button>`;
    else nt.innerHTML = `<span>${esc(L().hitsHere(list.length, mname(m)))}</span>` + (other ? `<span>${esc(L().hitsOther(other))}</span><button type="button" class="link" data-scope="all">${esc(L().showAll)}</button>` : '');
    nt.hidden = false;
  } else nt.hidden = true;
  $('#plist').innerHTML = list.map(rowHTML).join('');
  $('#plist').hidden = $('#phead').hidden = list.length === 0;
  // „nie znaleźliśmy” tylko gdy części nie ma nigdzie; wyniki w innych maszynach pokazuje komunikat wyżej
  $('#empty').hidden = list.length > 0 || (scope !== 'all' && other > 0);
  $('#empty').textContent = query ? L().none(query) : L().noneType;
  $('#liveCount').textContent = L().live(list.length);
  $('#vatnote').textContent = L().vatnote;
  nbsp($('#czesci'));
}
$('#pbar').addEventListener('click', e => {
  if (!e.target.closest('#changeM')) return;
  const b = $(`[data-m="${CSS.escape(current)}"]`);
  document.getElementById('maszyny').scrollIntoView({ block: 'start' });
  if (b) b.focus({ preventScroll: true });
});
$('#chips').addEventListener('click', e => { const b = e.target.closest('[data-t]'); if (!b) return; type = b.dataset.t; keepFocus(renderParts); });
$('#notice').addEventListener('click', e => {
  const b = e.target.closest('[data-scope]'); if (!b) return;
  scope = b.dataset.scope; renderParts();
  const nb = $('#notice [data-scope]'); (nb || $('#q')).focus();
});
$('#plist').addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.dataset.dec || t.dataset.inc) {
    const nr = t.dataset.dec || t.dataset.inc, inp = $(`[data-q="${CSS.escape(nr)}"]`);
    const cur = readQty(inp.value).v, next = cur + (t.dataset.inc ? 1 : -1);
    if (next > MAXQ) toast(L().maxMsg);
    const v = Math.max(1, Math.min(MAXQ, next));
    inp.value = v; draft.set(nr, v);
    return;
  }
  if (t.dataset.add) addToCart(t.dataset.add, t);
});
$('#plist').addEventListener('change', e => {
  const inp = e.target.closest('[data-q]'); if (!inp) return;
  const r = readQty(inp.value); inp.value = r.v; draft.set(inp.dataset.q, r.v);
  if (r.fixed) toast(L().qtyMsg);
});
$('#plist').addEventListener('keydown', e => {
  const inp = e.target.closest('[data-q]'); if (!inp || e.key !== 'Enter') return;
  e.preventDefault(); const b = $(`[data-add="${CSS.escape(inp.dataset.q)}"]`); if (b) b.click();
});
function addToCart(nr, btn) {
  const inp = $(`[data-q="${CSS.escape(nr)}"]`), r = readQty(inp ? inp.value : 1), p = byNr.get(nr);
  if (r.fixed) { if (inp) inp.value = r.v; toast(L().qtyMsg); return; }
  const it = cart.get(nr), had = it ? it.qty : 0;
  if (had >= MAXQ) { toast(L().maxMsg); return; }
  const qty = Math.min(MAXQ, had + r.v);
  cart.set(nr, { nr, qty, m: it ? it.m : (fitsCur(p) ? current : p.refs[0]) });
  renderCart();
  toast(had + r.v > MAXQ ? L().maxMsg : L().toastAdd(pname(p), qty));
  if (inp) inp.value = 1; draft.delete(nr);
  if (btn) { btn.textContent = L().added; btn.classList.add('ok'); clearTimeout(btn._t); btn._t = setTimeout(() => { btn.textContent = L().add; btn.classList.remove('ok'); }, 1400); }
  bump();
}

/* wyszukiwanie */
function setQuery(v) { query = v.trim(); $('#q').value = v; $('#qClear').hidden = !query; }
$('#q').addEventListener('input', e => { query = e.target.value.trim(); if (!query) scope = 'machine'; $('#qClear').hidden = !query; renderParts(); });
$('#q').addEventListener('keydown', e => { if (e.key === 'Escape' && query) { e.stopPropagation(); setQuery(''); scope = 'machine'; renderParts(); } });
$('#qClear').onclick = () => { setQuery(''); scope = 'machine'; renderParts(); $('#q').focus(); };
$('#haveNr').onclick = () => { document.getElementById('czesci').scrollIntoView({ block: 'start' }); $('#q').focus({ preventScroll: true }); };

/* koszyk */
const items = () => [...cart.values()];
function totals() {
  const sub = r2(items().reduce((a, it) => a + unit(byNr.get(it.nr).price) * it.qty, 0));
  const tax = r2(sub * vat());
  return { sub, tax, gross: r2(sub + tax), n: items().reduce((a, b) => a + b.qty, 0) };
}
function bump() {
  const t = totals();
  $('#cartCount').textContent = t.n;
  $('#cartTot').hidden = !t.n; $('#cartTot').textContent = t.n ? fmt(t.gross) : '';
  $('#openCart').setAttribute('aria-label', `${L().cart}: ${L().pcs(t.n)}${t.n ? ', ' + fmt(t.gross) : ''}`);
}
function cartMachines() { return [...new Set(items().map(it => it.m))].map(M); }
function mfield(id) { return mform[id] || (mform[id] = { sym: '', year: '', serial: '' }); }
function renderCart() {
  bump();
  const list = items();
  if (!list.length) { $('#dbody').innerHTML = `<div class="cempty"><p>${esc(L().cempty)}</p><button type="button" class="btn" id="toParts">${esc(L().cemptyBtn)}</button></div>`; nbsp($('#drawer')); return; }
  const t = totals();
  const nameLabel = buyer === 'firm' ? L().fFirm : buyer === 'farm' ? L().fFarm : L().fName;
  $('#dbody').innerHTML = list.map(it => { const p = byNr.get(it.nr), nm = esc(pname(p)); return `<div class="citem">
      <div><div class="n hy">${nm}</div><div class="m"><span class="num">${esc(p.nr)}</span>, ${esc(mname(M(it.m)))}, ${fmt(unit(p.price))} ${esc(L().net)} / ${esc(L().perPc)}</div></div>
      <div class="lt num">${fmt(r2(unit(p.price) * it.qty))}<small>${esc(L().net)}</small></div>
      <div class="r"><span class="qty"><button type="button" data-cdec="${esc(p.nr)}" aria-label="${esc(L().dec)}">−</button><input class="num" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="4" value="${it.qty}" data-cq="${esc(p.nr)}" aria-label="${esc(L().qtyAria(pname(p)))}"><button type="button" data-cinc="${esc(p.nr)}" aria-label="${esc(L().inc)}">+</button></span><button class="rm" type="button" data-rm="${esc(p.nr)}" aria-label="${esc(L().removeAria(pname(p)))}">${esc(L().remove)}</button></div>
    </div>`; }).join('') +
    `<div class="sums"><div><span>${esc(L().sub)}</span><span class="num">${fmt(t.sub)}</span></div><div><span>${esc(L().vat)}</span><span class="num">${fmt(t.tax)}</span></div><div class="tot"><span>${esc(L().tot)}</span><span class="num">${fmt(t.gross)}</span></div><p class="dfoot" style="margin-top:6px">${esc(L().shipNote)}</p></div>
    <form class="oform" id="oform" novalidate>
      <h3>${esc(L().form)}</h3>
      ${cartMachines().map(m => { const f = mfield(m.id), id = esc(m.id); return `<fieldset class="mset"><legend><b>${esc(mname(m))}</b> <span>${esc(mtype(m))}</span></legend>
        <label>${esc(L().fSym)}<select data-msym="${id}" id="sym-${id}"><option value="">${esc(L().fSymPick)}</option>${m.symbols.map(s => `<option value="${esc(s)}"${f.sym === s ? ' selected' : ''}>${esc(s)}</option>`).join('')}<option value="?"${f.sym === '?' ? ' selected' : ''}>${esc(L().fSymUnknown)}</option></select></label>
        <div class="grid2"><label>${esc(L().fYear)}<input data-myear="${id}" id="year-${id}" inputmode="numeric" maxlength="4" autocomplete="off" value="${esc(f.year)}"></label>
        <label><span>${esc(L().fSerial)} <i>${esc(L().fSerialHint)}</i></span><input data-mserial="${id}" id="serial-${id}" maxlength="30" autocomplete="off" value="${esc(f.serial)}"></label></div>
      </fieldset>`; }).join('')}
      <fieldset><legend>${esc(L().who)}</legend>
        <div class="seg">${['private', 'farm', 'firm'].map(b => `<button type="button" data-buyer="${b}" aria-pressed="${buyer === b}">${esc(L()[b === 'private' ? 'priv' : b])}</button>`).join('')}</div>
      </fieldset>
      <label>${esc(nameLabel)}<input id="fName" autocomplete="${buyer === 'firm' ? 'organization' : 'name'}" maxlength="120" value="${esc(form.name)}"></label>
      ${buyer !== 'private' ? `<label><span>${esc(L().fNip)}${buyer === 'farm' ? ` <i>${esc(L().optional)}</i>` : ''}</span><input id="fNip" ${lang === 'pl' ? 'inputmode="numeric"' : ''} maxlength="20" autocomplete="off" value="${esc(form.nip)}"></label>` : ''}
      <div class="grid2"><label>${esc(L().fTel)}<input id="fTel" type="tel" autocomplete="tel" maxlength="20" value="${esc(form.tel)}"></label>
      <label>${esc(L().fMail)}<input id="fMail" type="email" autocomplete="email" maxlength="120" value="${esc(form.mail)}"></label></div>
      <fieldset><legend>${esc(L().del)}</legend>
        <div class="seg">${['courier', 'pickup'].map(d => `<button type="button" data-del="${d}" aria-pressed="${delivery === d}">${esc(L()[d])}</button>`).join('')}</div>
      </fieldset>
      ${delivery === 'courier' ? `<label>${esc(L().fAddr)}<textarea id="fAddr" autocomplete="street-address" rows="2" maxlength="300">${esc(form.addr)}</textarea></label>` : ''}
      <label><span>${esc(L().fNote)} <i>${esc(L().optional)}</i></span><textarea id="fNote" rows="2" maxlength="600">${esc(form.note)}</textarea></label>
      <p class="err" id="ferr" role="alert"></p>
      <button class="btn" type="submit">${esc(L().send)}</button>
      <p class="dfoot">${esc(L().dfoot)}</p>
    </form>`;
  nbsp($('#drawer'));
}
function keepForm() {
  const g = id => { const el = document.getElementById(id); return el ? el.value : undefined; };
  const v = { name: g('fName'), nip: g('fNip'), tel: g('fTel'), mail: g('fMail'), addr: g('fAddr'), note: g('fNote') };
  for (const k in v) if (v[k] !== undefined) form[k] = v[k];
  $$('[data-msym]').forEach(el => { mfield(el.dataset.msym).sym = el.value; });
  $$('[data-myear]').forEach(el => { mfield(el.dataset.myear).year = el.value; });
  $$('[data-mserial]').forEach(el => { mfield(el.dataset.mserial).serial = el.value; });
}
$('#dbody').addEventListener('input', e => { keepForm(); if (e.target.getAttribute('aria-invalid')) { e.target.removeAttribute('aria-invalid'); e.target.removeAttribute('aria-describedby'); } });
$('#dbody').addEventListener('change', e => {
  keepForm();
  const inp = e.target.closest('[data-cq]'); if (!inp) return;
  const r = readQty(inp.value); cart.get(inp.dataset.cq).qty = r.v;
  if (r.fixed) toast(L().qtyMsg);
  keepFocus(renderCart);
});
$('#dbody').addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.closest('[data-cq]')) { e.preventDefault(); e.target.blur(); e.target.focus(); } });
$('#dbody').addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.id === 'toParts') { closeCart(false); document.getElementById('czesci').scrollIntoView({ block: 'start' }); $('#q').focus({ preventScroll: true }); return; }
  if (t.dataset.buyer) { keepForm(); buyer = t.dataset.buyer; keepFocus(renderCart); return; }
  if (t.dataset.del) { keepForm(); delivery = t.dataset.del; keepFocus(renderCart); return; }
  const nr = t.dataset.cdec || t.dataset.cinc || t.dataset.rm; if (!nr) return;
  keepForm();
  if (t.dataset.rm) cart.delete(nr);
  else {
    const it = cart.get(nr), next = it.qty + (t.dataset.cinc ? 1 : -1);
    if (next > MAXQ) toast(L().maxMsg);
    it.qty = Math.max(1, Math.min(MAXQ, next));
  }
  keepFocus(renderCart, '#closeCart');
});
$('#dbody').addEventListener('submit', e => {
  e.preventDefault(); keepForm();
  $$('#oform [aria-invalid]').forEach(el => { el.removeAttribute('aria-invalid'); el.removeAttribute('aria-describedby'); });
  const err = $('#ferr');
  const bad = (msg, sel) => { err.textContent = msg; const el = $(sel); if (el) { el.setAttribute('aria-invalid', 'true'); el.setAttribute('aria-describedby', 'ferr'); el.focus(); } return false; };
  for (const m of cartMachines()) {
    const f = mfield(m.id), id = CSS.escape(m.id);
    if (!f.sym) return bad(L().errSym(mname(m)), `#sym-${id}`);
    const y = f.year.trim();
    if (y && !(/^\d{4}$/.test(y) && +y >= 1985 && +y <= YEAR)) return bad(L().errYear, `#year-${id}`);
    if (f.sym === '?' && !y && !f.serial.trim()) return bad(L().errUnknown(mname(m)), `#year-${id}`);
  }
  if (!form.name.trim()) return bad(L().errName, '#fName');
  if (buyer !== 'private') {
    const nip = form.nip.replace(/[\s-]/g, '').toUpperCase();
    const okNip = lang === 'de' ? /^[A-Z]{2}[0-9A-Z]{8,12}$/.test(nip) : /^(PL)?\d{10}$/.test(nip);
    if ((buyer === 'firm' || nip) && !okNip) return bad(L().errNip, '#fNip');
  }
  const tel = form.tel.trim(), mail = form.mail.trim();
  if (!tel && !mail) return bad(L().errContact, '#fTel');
  if (tel && tel.replace(/\D/g, '').length < 9) return bad(L().errTel, '#fTel');
  if (mail && !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(mail)) return bad(L().errMail, '#fMail');
  if (delivery === 'courier' && !form.addr.trim()) return bad(L().errAddr, '#fAddr');
  err.textContent = '';
  openModal(summary());
});
function summary() {
  const t = totals(), l = L();
  const lines = items().map(it => { const p = byNr.get(it.nr); return `${p.nr} – ${pname(p)} – ${l.pcs(it.qty)}`; });
  const ms = cartMachines().map(m => { const f = mfield(m.id); return `${mname(m)} (${mtype(m)}), ${f.sym === '?' ? l.oUnknown : f.sym}${f.year.trim() ? `, ${l.oYear} ${f.year.trim()}` : ''}${f.serial.trim() ? `, ${l.oSerial} ${f.serial.trim()}` : ''}`; });
  const who = [form.name.trim(), buyer !== 'private' && form.nip.trim() ? `${l.fNip} ${form.nip.trim()}` : '', form.tel.trim(), form.mail.trim()].filter(Boolean).join(', ');
  const kind = l[buyer === 'private' ? 'priv' : buyer], note = form.note.trim().replace(/\s*\n\s*/g, ' ');
  const del = delivery === 'pickup' ? l.pickup : `${l.courier}\n${l.oAddr}: ${form.addr.trim().replace(/\s*\n\s*/g, ', ')}`;
  // w podsumowaniu zwykłe spacje i bez miękkich dywizów (łatwe kopiowanie)
  return `${ms.length > 1 ? l.oMachines : l.oMachine}:\n${ms.join('\n')}\n\n${l.oLines}:\n${lines.join('\n')}\n\n${l.oBuyer} (${kind}): ${who}\n${l.oDel}: ${del}${note ? `\n${l.oNote}: ${note}` : ''}\n${l.oSum}: ${fmt(t.gross)}`.replace(/[  ]/g, ' ').replace(/­/g, '');
}

/* okna: koszyk i potwierdzenie (reszta strony nieaktywna, fokus wraca) */
const PAGE = ['.demobar', 'header.site', 'main', 'footer'];
const setInert = (sels, on) => sels.forEach(s => { const el = $(s); if (el) el.inert = on; });
let cartBack = null;
function openCart() {
  cartBack = document.activeElement;
  keepForm(); renderCart();
  $('#drawer').classList.add('open'); $('#shade').classList.add('open');
  $('#drawer').inert = false; setInert(PAGE, true);
  document.body.style.overflow = 'hidden';
  $('#closeCart').focus();
}
function closeCart(restore = true) {
  keepForm();
  $('#drawer').classList.remove('open'); $('#shade').classList.remove('open');
  $('#drawer').inert = true; setInert(PAGE, false);
  document.body.style.overflow = '';
  if (restore) (cartBack && document.contains(cartBack) ? cartBack : $('#openCart')).focus();
}
$('#drawer').inert = true;
$('#openCart').onclick = openCart; $('#closeCart').onclick = () => closeCart(); $('#shade').onclick = () => closeCart();
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if ($('#modal').classList.contains('open')) closeModal(); else if ($('#drawer').classList.contains('open')) closeCart(); }
  if (e.key === 'Tab') {   // pętla fokusu w otwartym oknie
    const box = $('#modal').classList.contains('open') ? $('#modal') : $('#drawer').classList.contains('open') ? $('#drawer') : null;
    if (!box) return;
    const f = [...box.querySelectorAll('button,input,select,textarea,a[href]')].filter(el => !el.disabled && el.offsetParent !== null);
    if (!f.length) return;
    const first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }
});
let modalBack = null;
function openModal(text) {
  modalBack = document.activeElement;
  $('#mTitle').textContent = L().sentT; $('#mText').textContent = L().sentP; $('#mPre').textContent = text; $('#mOk').textContent = L().ok;
  $('#modal').classList.add('open'); setInert([...PAGE, '#drawer'], true); $('#mOk').focus();
}
function closeModal() {
  $('#modal').classList.remove('open');
  const open = $('#drawer').classList.contains('open');
  $('#drawer').inert = !open; if (!open) setInert(PAGE, false);
  (modalBack && document.contains(modalBack) && !modalBack.closest('[inert]') ? modalBack : (open ? $('#closeCart') : $('#openCart'))).focus();
}
$('#mOk').onclick = closeModal; $('#modal').onclick = e => { if (e.target.id === 'modal') closeModal(); };
let toastT = 0;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2400); }

/* typografia: liczba nie zostaje bez jednostki, myślnik nie zaczyna wiersza; po polsku także jednoliterowe wyrazy nie kończą wiersza */
function nbsp(root = document.body) {
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, { acceptNode: n => n.parentElement.closest('script,style,svg,textarea,pre') ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT });
  let n; while ((n = w.nextNode())) {
    let v = n.nodeValue.replace(/(\d) (?=[%a-zA-Z\u00c0-\u017e])/g, '$1\u00a0').replace(/ \u2013/g, '\u00a0\u2013');
    if (lang === 'pl') v = v.replace(/(^|[\s(\u201e])([aiouwzAIOUWZ]) /g, '$1$2\u00a0');
    if (v !== n.nodeValue) n.nodeValue = v;
  }
}
const setHH = () => document.documentElement.style.setProperty('--hh', $('header.site').offsetHeight + 'px');
addEventListener('resize', setHH);

/* język */
function applyLang() {
  document.documentElement.lang = lang;
  clearTimeout(toastT); $('#toast').classList.remove('show'); $('#toast').textContent = '';
  $$('[data-i]').forEach(el => { const v = L()[el.dataset.i]; if (typeof v === 'string') el.innerHTML = v; });
  $$('[data-i-alt]').forEach(el => { el.alt = L()[el.dataset.iAlt]; });
  $$('[data-i-aria]').forEach(el => el.setAttribute('aria-label', L()[el.dataset.iAria]));
  $('#h1').innerHTML = L().h1.map(s => `<span class="l">${s}</span>`).join('');
  document.title = L().title; $('meta[name=description]').content = L().desc;
  $$('[data-lang]').forEach(b => b.setAttribute('aria-pressed', b.dataset.lang === lang));
  $('#q').placeholder = L().ph;
  $('#qClear').setAttribute('aria-label', L().clear); $('#closeCart').setAttribute('aria-label', L().close);
  renderMachines(); renderParts(); renderCart(); nbsp(); setHH();
}
$$('[data-lang]').forEach(b => b.onclick = () => {
  keepForm(); lang = b.dataset.lang; applyLang();
  const u = new URL(location.href); if (lang === 'de') u.searchParams.set('lang', 'de'); else u.searchParams.delete('lang');
  try { history.replaceState(null, '', u); } catch (_) {}
  b.focus();
});

applyLang();
if (document.fonts) document.fonts.ready.then(setHH);
})();
</script>
